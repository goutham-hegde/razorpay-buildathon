[project]
name = "reclaim"
version = "0.1.0"
description = "A bounded revenue-recovery agent for failed payments and failed mandates"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows ships no zoneinfo database
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["reclaim*"]
